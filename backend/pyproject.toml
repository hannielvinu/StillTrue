[project]
name = "stilltrue"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.2", "uvicorn==0.34.2", "pydantic==2.11.4", "pydantic-settings==2.9.1", "httpx==0.28.1", "aiosqlite==0.21.0", "PyYAML==6.0.2", "slowapi==0.1.9"]
[dependency-groups]
dev = ["ruff==0.11.9", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "respx==0.22.0", "pip-audit==2.9.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"../scripts/*.py" = ["E402"]
"../benchmark/*.py" = ["E402"]
